name: CI/CD

# Runs on every push. Deploys to the local kind cluster only when all tests
# pass: a test failure aborts the job before any deploy step, leaving the
# currently-running version untouched.
#
# This targets a LOCAL kind cluster (the one from Q5), so it is intended to be
# run with `act` rather than on GitHub's hosted runners (those have no kind
# cluster). Provide the local kubeconfig via the `KUBECONFIG_FILE` secret:
#
#   act --container-architecture linux/amd64 \
#       -s KUBECONFIG_FILE="$(cat ~/.kube/config)" \
#       -j build-test-deploy
on:
  push:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: agent-relay:${{ github.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          cache: false # act's runner image can't run setup-uv's node-based post cache step

      - name: Install dependencies
        run: uv sync --frozen

      # The starter suite + the acceptance integration test, run against a real
      # PostgreSQL instance (the CI service) rather than the SQLite default.
      - name: Run tests against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay
        run: |
          uv run pytest -q
          echo "ALL TESTS PASSED"

      # Unique image tag per version (git SHA) so each rollout is distinct and
      # the previous image stays available in the host Docker store.
      - name: Build Docker image
        run: docker build -t "$IMAGE_TAG" .

      # act's runner image may not ship kubectl/kind; install them if missing.
      - name: Set up kubectl + kind
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sLO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
          fi
          if ! command -v kind >/dev/null 2>&1; then
            curl -sLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          fi
          kubectl version --client --output=yaml | grep -E 'gitVersion' | head -1
          kind version

      # Feed the host's kubeconfig in (act: --network host already reaches the
      # kind API on 127.0.0.1).
      - name: Configure kubeconfig
        env:
          KUBECONFIG_FILE: ${{ secrets.KUBECONFIG_FILE }}
        run: |
          if [ -n "$KUBECONFIG_FILE" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s' "$KUBECONFIG_FILE" > "$HOME/.kube/config"
          fi

      - name: Load image into kind
        run: kind load docker-image "$IMAGE_TAG" --name kind

      - name: Deploy PostgreSQL
        run: kubectl apply -f k8s/postgres.yaml

      - name: Deploy application
        run: |
          kubectl apply -f k8s/app.yaml
          kubectl set image deployment/agent-relay agent-relay="$IMAGE_TAG"
          kubectl rollout status deployment/agent-relay --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get pods -l app=agent-relay
          kubectl get pods -l app=postgres

      - name: Verify heading in deployed dashboard
        run: |
          kubectl port-forward svc/agent-relay 8000:8000 >/tmp/pf.log 2>&1 &
          PF=$!
          sleep 5
          echo "Dashboard heading:"
          curl -s http://127.0.0.1:8000/dashboard | grep -o "<h1>[^<]*</h1>"
          kill $PF 2>/dev/null || true
